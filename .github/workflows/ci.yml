name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt
      - name: Testlar (PTY testlari standalone — chiqarib tashlanadi)
        env:
          PYTHONIOENCODING: utf-8
        run: >
          python -m pytest -q
          --ignore=tests/test_e2e.py
          --ignore=tests/test_pty_env.py
          --ignore=tests/test_pty_terminal.py
          --ignore=tests/test_pty_claude.py
          --ignore=tests/e2e_agy_studio.py
          --ignore=tests/test_live_scene.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Kutubxonalarni o'rnatish
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript tekshiruvi
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

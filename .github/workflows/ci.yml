name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    # Linux: HTTP/API qatlami, toollar, engine. PTY (pywinpty) bu yerda yo'q —
    # `windows` job'i uni qoplaydi, shuning uchun endi `--ignore` shart emas.
    runs-on: ubuntu-latest
    # Runaway job 6 soatgacha osilib qolmasin (o'lchangan: 2026-11-27).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt
      - name: Playwright brauzerini o'rnatish
        run: python -m playwright install --with-deps chromium
      - name: Testlar
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

  backend-windows:
    # Haqiqiy PTY, ConPTY backend, PowerShell va Windows kodlash sinovi.
    # Bu job `test_pty_live.py` ni yurgizadi: avval bu qamrov qo'lda
    # skriptlarda edi va CI'da umuman tekshirilmasdi.
    runs-on: windows-latest
    # Runaway job GitHub'ning 6 soatlik chegarasigacha osilib qolmasin.
    # 2026-11-27 da job 13.5 daqiqa jim qolgan edi (run 45984826851).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt
      - name: Playwright brauzerini o'rnatish
        # Skrinshot testlari (`tools.tool_screenshot` -> playwright) brauzersiz
        # 30s kutib osilib qoladi. Ubuntu job'ida bu qadam bor edi, Windows'da
        # yo'q edi — natijada to'liq to'plam 25 daqiqadan ortiq osilgan.
        run: python -m playwright install chromium
      - name: PTY va Windows'ga xos testlar
        env:
          PYTHONIOENCODING: utf-8
          # ConPTY backend: WinPTY'da Ctrl+C ishlamaydi (o'lchangan).
          PYWINPTY_BACKEND: "1"
        run: >
          python -m pytest -q
          tests/test_pty_live.py
          tests/test_pty_backend.py
          tests/test_utf8_subprocess.py
          tests/test_live_scene_ws.py
          tests/test_five_hour_findings.py
      - name: To'liq to'plam (Windows'da ham yashil bo'lishi shart)
        env:
          PYTHONIOENCODING: utf-8
          PYWINPTY_BACKEND: "1"
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Kutubxonalarni o'rnatish
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript tekshiruvi
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

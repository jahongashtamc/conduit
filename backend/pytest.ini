[pytest]
# Har test uchun qattiq chegara. CI'da bitta osilgan test butun job'ni
# GitHub'ning 6 soatlik limitigacha ushlab turishi mumkin edi (o'lchangan:
# run 45984826851 — Windows job 13.5 daqiqa jim qoldi, keyin o'ldirildi).
# 120s eng sekin haqiqiy testdan (test_ctrl_c ~6s, screenshot ~11s,
# blender ~7s) ancha yuqori, shuning uchun sekin CI runner'larda ham
# soxta yiqilish bermaydi.
timeout = 120
timeout_method = thread
# Timeout — XATO, skip emas: osilish haqiqiy nuqson va ko'rinishi shart.
timeout_func_only = false

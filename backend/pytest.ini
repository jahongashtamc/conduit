[pytest]
# Har test uchun qattiq chegara.
#
# `timeout_method = thread` — Python bayt-kodini to'xtatadi. Subprocess yoki
# C-kengaytma ichida osilgan testni to'xtata olmaydi, LEKIN pytest davom
# etadi va testni FAIL deb belgilaydi (faqat osilgan oqim qolib ketadi).
# Bu izolyatsiyalangan modul yurgizishda yetarli (scripts/run_tests_by_module.py).
#
# Nega `faulthandler_timeout` ham bor: stack trace qaysi test qayerda
# osilganini ko'rsatadi — CI logida aniq joy ko'rinadi.
#
# O'lchangan (2026-11-27): `timeout` sozlamasi yolg'iz o'zi yetarli emas,
# chunki osilish ko'pincha subprocess ichida bo'ladi. Shu sababli CI
# `scripts/run_tests_by_module.py` orqali har modulni alohida jarayonda
# yurgizadi: osilgan modul o'z jarayoni bilan o'ladi, qolganlari davom etadi.
timeout = 180
timeout_method = thread
timeout_func_only = false
# 190s dan oshsa stack trace chop etiladi (diagnostika).
faulthandler_timeout = 190

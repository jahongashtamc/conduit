[pytest]
# Har test uchun qattiq chegara. CI'da bitta osilgan test butun job'ni
# GitHub'ning 6 soatlik limitigacha ushlab turishi mumkin edi (o'lchangan:
# run 45984826851 — Windows job 13.5 daqiqa jim qoldi, keyin o'ldirildi).
#
# `timeout_method = thread` ATAYLAB ishlatilmaydi: u faqat Python bayt-kodini
# to'xtatadi. Test subprocess yoki C-kengaytma ichida osilsa (blender,
# playwright, PTY o'qish) thread o'ldirilmaydi — pytest davom eta olmaydi va
# job yana butun limitgacha osilib qoladi. O'lchangan: run 45999365515 da
# to'liq to'plam 28 daqiqadan ortiq davom etdi.
#
# Ishonchli chegara ikki qatlamda:
#   1) `faulthandler_timeout` — osilgan joyni stack trace bilan chop etadi
#      (diagnostika; jarayonni to'xtatmaydi).
#   2) CI'da `timeout-minutes` (job) — jarayonni majburan o'ldiradi.
#      Lokalda: `pytest --timeout=120` (pytest-timeout o'rnatilgan bo'lsa).
timeout = 120
timeout_func_only = false
# 120s dan oshsa stack trace chop etiladi — qaysi test va qayerda osilgani
# logdan darhol ko'rinadi.
faulthandler_timeout = 130
